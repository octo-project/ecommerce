<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce.mg</title>
    <style>
      .ellipsis-text {
        width: 100%;
        line-clamp: 4;
        font-size: 11px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
      }

      .btn-icon {
        gap: 4px;
        display: flex;
        align-items: center;
      }

      .btn-icon::before {
        content: '';
        width: 16px;
        height: 16px;
        fill: white;
        display: inline-block;
        background-size: contain !important;
      }

      .--home::before {
        background: url('/public/icons/dashboard/home.svg');
      }
      .--account::before {
        background: url('/public/icons/dashboard/user.svg');
      }
      .--cart::before {
        background: url('/public/icons/dashboard/cart.svg');
      }
      .--product::before {
        background: url('/public/icons/dashboard/product.svg');
      }
      .--invoice::before {
        background: url('/public/icons/dashboard/invoice.svg');
      }
      .--setting::before {
        background: url('/public/icons/dashboard/setting.svg');
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
